<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        <label for="first-name">First Name:*</label>
        <input type="text" id="first-name" required>
        <br><br>

        <label for="last-name">Last Name:*</label>
        <input type="text" id="last-name" required>
        <br><br>

        <label for="email">Email Address:*</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="password">Password:*</label>
        <input type="password" id="password" required>
        <br><br>

        <label for="confirm-password">Confirm Password:*</label>
        <input type="password" id="confirm-password" required>
        <br><br>

        <label for="birthday">Birthday:*</label>
        <input type="date" id="birthday" required>
        <br><br>

       
         <label>Gender Identify:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        
        <input type="radio" id="not-to-answer" name="gender" value="not-to-answer">
        <label for="not-to-answer">I prefer not to answer</label>
        <br><br> 
        
        <label for="description">A short description about my self:</label><br>
        <textarea id="description" rows="4" cols="40"></textarea>
        <br><br>

       
        <label for="language">Favorite language:</label>
        <select id="language">
            <option value="java">Java</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="c++">C++</option>
        </select>
        <br><br>

        
        <input type="checkbox" id="updates">
        <label for="updates">Yes, I would like to receive periodic email updates</label>
        <br><br>

        
        <input type="submit" value="Create Account">
        <br><br>

        
        <p><small>* Indicates a required field</small></p>
    </form>

</body>
</html>
