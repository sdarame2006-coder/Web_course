<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header class="navbar">
        <h1 class="logo">Activity</h1>
        <input type="text" class="search-input" placeholder="Search">
        <button id="loginBtn" class="btn btn-blue" onclick="toggleLogin(this)">Login</button>
    </header>

    <div class="main-container">
        
        <main class="left-section">
            

            <div class="card flex-card">
                <div class="card-left">
                    <h2>Welcome</h2>
                    <p class="italic-text">noun</p>
                    <p class="sub-text">Plural: <em>Engineers</em></p>
                    <button id="btn13" class="btn btn-yellow" onclick="handle13Likes(this)">13 likes</button>
                </div>
                <div class="card-right">
                    <p>A practitioner skilled in the <a href="#">Japanese </a> <span> art of </span> <a href="#"> ninjutsu</a></p>
                </div>
            </div>


            <div class="card flex-card">
                <div class="card-left">
                    <h2>Engineer</h2>
                    <p class="italic-text">noun</p>
                    <p class="sub-text">Plural: <em>Engineers</em></p>
                    <button id="btn37" class="btn btn-yellow" onclick="handle37Likes(this)">37 likes</button>
                </div>
                <div class="card-right">
                    <p>A programmer who breaks down problems with <a href="#">Zen </a> <span>-like focus</span></p>
                </div>
            </div>

            <div class="card">
                <div class="like-row">
                    <h3>Some User <span id="likeCount">3</span> like(s)</h3>
                    <button id="likeBtn" class="btn btn-yellow" onclick="handleLike(this)">Like</button>
                </div>
                <p class="filler-text">This is some filer text, it can say anything we like</p>
            </div>

        </main>

        <aside class="right-section">
            <div class="card text-center">
                <h3>JavaScript is defined by YOU</h3>
                <button class="btn btn-green" onclick="removeDefinition(this)">Add Definition</button>
            </div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
